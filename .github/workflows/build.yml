# BELUM DIUJI - sesuaikan bila perlu. Membuat aplikasi untuk Windows, Mac Apple Silicon, dan Mac Intel.
name: build
on: workflow_dispatch
jobs:
  build:
    strategy:
      matrix:
        include:
          - {os: windows-latest, name: windows}
          - {os: macos-14, name: mac-arm}
          - {os: macos-13, name: mac-intel}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pyinstaller
      - name: Bundel Tesseract (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install tesseract -y
          New-Item -ItemType Directory -Force vendor/tesseract | Out-Null
          Copy-Item "C:\Program Files\Tesseract-OCR\*" vendor/tesseract -Recurse
          Invoke-WebRequest https://github.com/tesseract-ocr/tessdata/raw/main/ind.traineddata -OutFile vendor/tesseract/tessdata/ind.traineddata
      - run: python -m pytest tests -q
        env: {QT_QPA_PLATFORM: offscreen}
        continue-on-error: true
      - run: pyinstaller --noconfirm --windowed --name "Cek Bukti TF e-guru.id" --collect-data googleapiclient --collect-data certifi main.py
      - if: matrix.os == 'windows-latest'
        run: Copy-Item -Recurse vendor "dist/Cek Bukti TF e-guru.id"/vendor
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: {name: "CekBukti-eguru-${{ matrix.name }}", path: dist}
